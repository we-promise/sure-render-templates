name: render e2e

# Creates real Render resources in the Sure workspace. COSTS MONEY while it
# runs: for sure-no-ai, $45.50/mo prorated per second (~$0.063/h), so a
# 30-60 minute run is roughly $0.03-0.07. Never on push/PR: manual, or called
# by "release test" for each new stable or alpha release (kill switch: repo
# variable RENDER_E2E_ON_RELEASE=false). If the RENDER_API_KEY secret is
# missing it skips (with a notice) instead of failing.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Deploy branch to test
        type: choice
        options: [sure-no-ai, sure-no-ai-latest]
        default: sure-no-ai
      confirm_cost:
        description: 'Type "yes" to confirm this run creates billable Render resources (~$0.063/h for sure-no-ai)'
        required: true
  workflow_call:
    inputs:
      branch:
        type: string
        default: sure-no-ai
      confirm_cost:
        type: string
        required: true
    secrets:
      RENDER_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  key:
    name: check RENDER_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.k.outputs.present }}
    steps:
      - id: k
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -n "$RENDER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_API_KEY secret is not set; skipping the Render e2e"
          fi

  validate:
    name: validate all Blueprints
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags origin '+refs/heads/sure-*:refs/remotes/origin/sure-*'
      - name: Render Blueprint validate API (creates nothing)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
        run: tests/render/validate.sh

  e2e:
    name: deploy + smoke + teardown (${{ inputs.branch }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: render-e2e-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags origin '+refs/heads/sure-*:refs/remotes/origin/sure-*'
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Render e2e
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          E2E_BRANCH: ${{ inputs.branch }}
          E2E_CONFIRM_COST: ${{ inputs.confirm_cost }}
          E2E_STATE: ${{ runner.temp }}/render-e2e-state.json
        run: tests/render/e2e.sh
      - name: Teardown
        # Backstop for a cancelled or timed-out run; e2e.sh already tears down
        # on exit. Safe to run twice.
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
        run: tests/render/teardown.sh "${{ runner.temp }}/render-e2e-state.json" "e2e-${{ github.run_id }}"
