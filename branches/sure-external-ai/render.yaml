services:
  - type: keyvalue
    name: sure-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: alphaclaw
    runtime: docker
    # Omit plan: Render preserves existing sizing; new services use paid 512 MB.
    # Choose a larger size in Render when needed. See README.md#service-sizing.
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WORKSPACE_REPO
        sync: false
      - key: WATCHDOG_AUTO_REPAIR
        value: "true"
      - key: PORT
        value: "3000"
      - key: ALPHACLAW_ROOT_DIR
        value: /data
      - key: REMOTE_MCP_URL
        value: http://sure-web:3000/mcp
      - key: REMOTE_MCP_API_TOKEN
        fromService:
          type: web
          name: sure-web
          envVarKey: MCP_API_TOKEN
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10

  - type: web
    name: sure-web
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:stable
    # Omit plan: Render preserves existing sizing; new services use paid 512 MB.
    # Choose a larger size in Render when needed. See README.md#service-sizing.
    autoDeployTrigger: off
    healthCheckPath: /
    disk:
      name: sure-storage
      mountPath: /rails/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SELF_HOSTED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      # Configure optional integrations in Sure first; env/group overrides are optional.
      # See docs/optional-integrations.md for setup and existing-deployment migration.
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        generateValue: true
      - key: MCP_USER_EMAIL
        sync: false
      - key: ASSISTANT_TYPE
        value: external
      - key: EXTERNAL_ASSISTANT_URL
        value: http://alphaclaw:3000/v1/chat/completions
      - key: EXTERNAL_ASSISTANT_TOKEN
        fromService:
          type: web
          name: alphaclaw
          envVarKey: OPENCLAW_GATEWAY_TOKEN

  - type: worker
    name: sure-worker
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:stable
    # Omit plan: Render preserves existing sizing; new services use paid 512 MB.
    # Choose a larger size in Render when needed. See README.md#service-sizing.
    autoDeployTrigger: off
    dockerCommand: bundle exec sidekiq
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: sure-web
          envVarKey: SECRET_KEY_BASE
      - key: SELF_HOSTED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      # Configure optional integrations in Sure first; env/group overrides are optional.
      # See docs/optional-integrations.md for setup and existing-deployment migration.
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        fromService:
          type: web
          name: sure-web
          envVarKey: MCP_API_TOKEN
      - key: MCP_USER_EMAIL
        fromService:
          type: web
          name: sure-web
          envVarKey: MCP_USER_EMAIL
      - key: ASSISTANT_TYPE
        value: external
      - key: EXTERNAL_ASSISTANT_URL
        value: http://alphaclaw:3000/v1/chat/completions
      - key: EXTERNAL_ASSISTANT_TOKEN
        fromService:
          type: web
          name: alphaclaw
          envVarKey: OPENCLAW_GATEWAY_TOKEN

databases:
  - name: sure-postgres
    plan: basic-1gb
    databaseName: sure_production
    user: sure_user
    postgresMajorVersion: "18"
