services:
  - type: keyvalue
    name: sure-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: alphaclaw
    runtime: docker
    plan: standard
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PORT
        value: "3000"
      - key: ALPHACLAW_ROOT_DIR
        value: /data
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10

  - type: web
    name: sure-web
    runtime: image
    image:
      url: ghcr.io/we-promise/sure:stable
    plan: starter
    autoDeploy: false
    healthCheckPath: /
    disk:
      name: sure-storage
      mountPath: /rails/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SELF_HOSTED
        value: "true"
      - key: RAILS_FORCE_SSL
        value: "false"
      - key: RAILS_ASSUME_SSL
        value: "false"
      - key: AI_DEBUG_MODE
        value: "false"
      - key: OPENAI_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_URI_BASE
        value: https://api.openai.com/v1
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        generateValue: true
      - key: MCP_USER_EMAIL
        sync: false
      - key: ASSISTANT_TYPE
        value: external
      - key: EXTERNAL_ASSISTANT_URL
        value: http://alphaclaw:3000/api/v1/chat/completions
      - key: EXTERNAL_ASSISTANT_TOKEN
        fromService:
          type: web
          name: alphaclaw
          envVarKey: OPENCLAW_GATEWAY_TOKEN
      - key: EXTERNAL_ASSISTANT_AGENT_ID
        value: main
      - key: EXTERNAL_ASSISTANT_SESSION_KEY
        value: agent:main:main
      - key: EXTERNAL_ASSISTANT_ALLOWED_EMAILS
        value: ""

  - type: worker
    name: sure-worker
    runtime: image
    image:
      url: ghcr.io/we-promise/sure:stable
    plan: starter
    autoDeploy: false
    dockerCommand: bundle exec sidekiq
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: sure-web
          envVarKey: SECRET_KEY_BASE
      - key: SELF_HOSTED
        value: "true"
      - key: RAILS_FORCE_SSL
        value: "false"
      - key: RAILS_ASSUME_SSL
        value: "false"
      - key: AI_DEBUG_MODE
        value: "false"
      - key: OPENAI_ACCESS_TOKEN
        fromService:
          type: web
          name: sure-web
          envVarKey: OPENAI_ACCESS_TOKEN
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_URI_BASE
        value: https://api.openai.com/v1
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        fromService:
          type: web
          name: sure-web
          envVarKey: MCP_API_TOKEN
      - key: MCP_USER_EMAIL
        fromService:
          type: web
          name: sure-web
          envVarKey: MCP_USER_EMAIL
      - key: ASSISTANT_TYPE
        value: external
      - key: EXTERNAL_ASSISTANT_URL
        value: http://alphaclaw:3000/api/v1/chat/completions
      - key: EXTERNAL_ASSISTANT_TOKEN
        fromService:
          type: web
          name: alphaclaw
          envVarKey: OPENCLAW_GATEWAY_TOKEN
      - key: EXTERNAL_ASSISTANT_AGENT_ID
        value: main
      - key: EXTERNAL_ASSISTANT_SESSION_KEY
        value: agent:main:main
      - key: EXTERNAL_ASSISTANT_ALLOWED_EMAILS
        value: ""

databases:
  - name: sure-postgres
    plan: starter
    databaseName: sure_production
    user: sure_user
    postgresMajorVersion: "16"
