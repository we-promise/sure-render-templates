services:
  - type: keyvalue
    name: sure-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: sure-web
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:latest
    # Omit plan: Render preserves existing sizing; new services use paid 512 MB.
    # Choose a larger size in Render when needed. See README.md#service-sizing.
    autoDeployTrigger: off
    healthCheckPath: /
    disk:
      name: sure-storage
      mountPath: /rails/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SELF_HOSTED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      # Configure optional integrations in Sure first; env/group overrides are optional.
      # See docs/optional-integrations.md for setup and existing-deployment migration.
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

  - type: worker
    name: sure-worker
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:latest
    # Omit plan: Render preserves existing sizing; new services use paid 512 MB.
    # Choose a larger size in Render when needed. See README.md#service-sizing.
    autoDeployTrigger: off
    dockerCommand: bundle exec sidekiq
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: sure-web
          envVarKey: SECRET_KEY_BASE
      - key: SELF_HOSTED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      # Configure optional integrations in Sure first; env/group overrides are optional.
      # See docs/optional-integrations.md for setup and existing-deployment migration.
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

databases:
  - name: sure-postgres
    plan: basic-1gb
    databaseName: sure_production
    user: sure_user
    postgresMajorVersion: "18"
