services:
  - type: keyvalue
    name: sure-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: sure-web
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:latest
    plan: standard
    autoDeployTrigger: off
    healthCheckPath: /
    disk:
      name: sure-storage
      mountPath: /rails/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SELF_HOSTED
        value: "true"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      - key: AI_DEBUG_MODE
        value: "false"
      - key: OPENAI_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_URI_BASE
        value: https://api.openai.com/v1
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        value: ""
      - key: MCP_USER_EMAIL
        value: ""
      - key: ASSISTANT_TYPE
        value: ""
      - key: EXTERNAL_ASSISTANT_URL
        value: ""
      - key: EXTERNAL_ASSISTANT_TOKEN
        value: ""

  - type: worker
    name: sure-worker
    runtime: image
    # Sure image tag: "stable" (default, recommended) or "latest" (newest build).
    # Render Blueprint files cannot take deploy-time inputs, so to deploy
    # "latest" instead, run scripts/use-image-tag.sh latest before deploying,
    # or after deploy set each service's image URL to
    # ghcr.io/we-promise/sure:latest in the Render Dashboard and redeploy.
    image:
      url: ghcr.io/we-promise/sure:latest
    plan: standard
    autoDeployTrigger: off
    dockerCommand: bundle exec sidekiq
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sure-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sure-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: sure-web
          envVarKey: SECRET_KEY_BASE
      - key: SELF_HOSTED
        value: "true"
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      - key: AI_DEBUG_MODE
        value: "false"
      - key: OPENAI_ACCESS_TOKEN
        fromService:
          type: web
          name: sure-web
          envVarKey: OPENAI_ACCESS_TOKEN
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_URI_BASE
        value: https://api.openai.com/v1
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MCP_API_TOKEN
        value: ""
      - key: MCP_USER_EMAIL
        value: ""
      - key: ASSISTANT_TYPE
        value: ""
      - key: EXTERNAL_ASSISTANT_URL
        value: ""
      - key: EXTERNAL_ASSISTANT_TOKEN
        value: ""

databases:
  - name: sure-postgres
    plan: basic-1gb
    databaseName: sure_production
    user: sure_user
    postgresMajorVersion: "18"
